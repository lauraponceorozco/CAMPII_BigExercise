[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campii-brats-segmentation"
version = "0.1.0"
description = "BraTS brain tumor segmentation with corruption testing and robustness evaluation"
requires-python = ">=3.8"
authors = [
    {name = "Esther Utasa", email = "esther.utasa@example.com"}
]

dependencies = [
    "nibabel>=4.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "brats>=0.1.0",
    "torch>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pytest>=6.0.0",
    "black>=21.0",
    "flake8>=3.9.0",
]

[tool.setuptools]
packages = ["campii"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
